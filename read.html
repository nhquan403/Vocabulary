<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài đọc</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">📖 Học từ vựng</a>
    <nav>
      <a href="index.html" class="active">Bài đọc</a>
      <a href="dictionary.html">Từ điển</a>
      <a href="review.html">Ôn tập <span class="badge" id="badge">0</span></a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <a class="btn" href="index.html">← Danh sách bài</a>
      <button class="btn" id="print" type="button">🖨️ In bài này (A4)</button>
      <span class="muted" id="info"></span>
    </div>
    <div class="player" id="player" hidden>
      <audio id="audio" preload="metadata"></audio>
      <button class="pbtn play" id="a-play" type="button" title="Phát / dừng (Space)" aria-label="Phát">▶</button>
      <button class="pbtn" id="a-back" type="button" title="Lùi 5 giây (←)" aria-label="Lùi 5 giây">⏪ 5s</button>
      <button class="pbtn" id="a-fwd" type="button" title="Tới 5 giây (→)" aria-label="Tới 5 giây">5s ⏩</button>
      <input class="seek" id="a-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Vị trí đang nghe">
      <span class="time" id="a-time">0:00 / 0:00</span>
      <select class="pbtn" id="a-rate" title="Tốc độ đọc" aria-label="Tốc độ đọc">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
      </select>
      <button class="pbtn" id="a-loop" type="button" title="Lặp lại cả bài" aria-label="Lặp lại" aria-pressed="false">🔁</button>
    </div>
    <article class="sheet" id="sheet"></article>
    <section class="story-words">
      <h2>Từ chưa biết trong bài này (<span id="sw-count">0</span>)</h2>
      <p class="muted" id="sw-empty">Bấm vào một từ trong bài rồi chọn “Chưa biết” để thêm vào đây.</p>
      <div class="chips" id="chips"></div>
    </section>
    <nav class="pager" id="pager"></nav>
  </main>

  <div class="popup" id="popup" hidden role="dialog" aria-label="Nghĩa của từ">
    <div class="head">
      <span class="word" id="p-word"></span>
      <button class="speak" id="p-speak" type="button" title="Nghe phát âm" aria-label="Nghe phát âm">🔊</button>
      <button class="close" id="p-close" type="button" aria-label="Đóng">×</button>
    </div>
    <div class="form" id="p-form"></div>
    <div class="pos" id="p-pos"></div>
    <div class="meaning" id="p-meaning"></div>
    <div class="actions">
      <button class="btn small" id="p-toggle" type="button"></button>
      <a class="btn small" id="p-dict" href="#">Xem trong từ điển</a>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/lemma.js"></script>
  <script src="js/common.js"></script>
  <script src="js/read.js"></script>
</body>
</html>
